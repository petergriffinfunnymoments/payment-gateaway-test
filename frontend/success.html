<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успешна!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            animation: scaleIn 0.5s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-icon svg {
            width: 60px;
            height: 60px;
            fill: white;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .message {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .payment-details {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-size: 14px;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .transaction-id {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #667eea;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .status-badge {
            display: inline-block;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
        </div>

        <div class="status-badge">✓ Оплата успешна</div>

        <h1>Спасибо за покупку!</h1>
        
        <p class="message">
            Ваш платеж успешно обработан. Мы отправили подтверждение на вашу электронную почту.
        </p>

        <div class="payment-details">
            <div class="detail-row">
                <span class="detail-label">Сумма платежа:</span>
                <span class="detail-value" id="amount">1 500.00 ₽</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Дата оплаты:</span>
                <span class="detail-value" id="date">--.--.----</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Номер транзакции:</span>
                <span class="detail-value transaction-id" id="transaction-id">---</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Способ оплаты:</span>
                <span class="detail-value" id="method">---</span>
            </div>
        </div>

        <a href="/" class="btn">Вернуться в магазин</a>
    </div>

    <script>
        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        
        // Заполняем данные из параметров
        const amount = urlParams.get('amount');
        const transactionId = urlParams.get('transaction_id');
        const method = urlParams.get('method');
        const date = urlParams.get('date');

        if (amount) {
            document.getElementById('amount').textContent = formatAmount(amount) + ' ₽';
        }
        
        if (transactionId) {
            document.getElementById('transaction-id').textContent = transactionId;
        } else {
            document.getElementById('transaction-id').textContent = generateTransactionId();
        }
        
        if (method) {
            const methods = {
                'SBP': 'СБП',
                'CARD': 'Банковская карта',
                'WALLET': 'Цифровой кошелек'
            };
            document.getElementById('method').textContent = methods[method] || method;
        }
        
        if (date) {
            document.getElementById('date').textContent = formatDate(date);
        } else {
            document.getElementById('date').textContent = getCurrentDate();
        }

        function formatAmount(value) {
            return parseFloat(value).toLocaleString('ru-RU', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getCurrentDate() {
            return new Date().toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function generateTransactionId() {
            return 'TXN' + Math.random().toString(36).substr(2, 9).toUpperCase();
        }
    </script>
</body>
</html>
